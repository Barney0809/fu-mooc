spring.application.name=file
server.port=9003
#eureka.instance.hostname=localhost
#eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:8000/eureka/
spring.cloud.nacos.discovery.server-addr=${NACOS_ADDR:127.0.0.1:8848}

server.servlet.context-path=/file

# 本地文件存放目录，末尾带 /；Linux 下示例：/data/upload/
file.path=${FILE_PATH:D:/logs/course/upload/}
# 文件访问域名，指向网关
file.domain=${FILE_DOMAIN:http://127.0.0.1:9000/file/f/}

#文件限制大小
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# oss —— 密钥从环境变量读取，不要写进仓库
oss.accessKeyId=${OSS_ACCESS_KEY_ID}
oss.accessKeySecret=${OSS_ACCESS_KEY_SECRET}
oss.endpoint=${OSS_ENDPOINT:http://oss-cn-beijing.aliyuncs.com}
oss.ossDomain=${OSS_DOMAIN:https://your-bucket.oss-cn-beijing.aliyuncs.com/}
oss.bucket=${OSS_BUCKET:your-bucket}

# vod —— 同上
vod.accessKeyId=${VOD_ACCESS_KEY_ID}
vod.accessKeySecret=${VOD_ACCESS_KEY_SECRET}
